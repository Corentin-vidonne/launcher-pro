# Construit l'installeur Windows à chaque push sur main.
# Quand la version de package.json n'a pas encore de release, la release « vX.Y.Z » est créée
# automatiquement avec l'installeur : il apparaît dans « Releases » sur la page du dépôt.
name: Installeur Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
      - "design/**"
  workflow_dispatch:

permissions:
  contents: write

# Deux pushs rapprochés ne doivent pas publier la même version en parallèle.
concurrency:
  group: installeur-windows
  cancel-in-progress: false

jobs:
  installeur:
    name: Installeur Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Version à publier
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::La release v$version existe déjà : installeur construit sans nouvelle publication (augmenter la version de package.json pour publier)."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Nouvelle version v$version : la release sera publiée."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Construire et publier la release
        if: steps.version.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Launcher Pro v${{ steps.version.outputs.version }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          releaseBody: |
            ## Installation

            1. Téléchargez **Launcher.Pro_${{ steps.version.outputs.version }}_x64-setup.exe** dans les fichiers ci-dessous.
            2. Lancez-le : l'installation se fait pour votre compte Windows, sans droits administrateur.
            3. L'installeur n'est pas signé numériquement : si Windows SmartScreen affiche « Windows a protégé votre ordinateur », cliquez sur **Informations complémentaires** puis **Exécuter quand même**.

            Launcher Pro démarre ensuite avec Windows, en fenêtre agrandie. Ce comportement se désactive dans **Réglages → Lancer au démarrage de Windows**.

            Configuration requise : Windows 10 ou 11 (64 bits). Le runtime WebView2 est installé automatiquement s'il manque.

      - name: Construire
        if: steps.version.outputs.publish != 'true'
        run: npx tauri build

      - name: Installeur en artefact
        uses: actions/upload-artifact@v7
        with:
          name: launcher-pro-${{ steps.version.outputs.version }}-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
